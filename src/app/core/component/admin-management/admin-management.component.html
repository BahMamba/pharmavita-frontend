<mat-toolbar color="primary">
  <span>Gérer les pharmaciens</span>
</mat-toolbar>
<div class="management-content">
  <div class="table-container">
    <mat-spinner *ngIf="isLoading" class="spinner"></mat-spinner>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
    <table mat-table [dataSource]="pharmacists" class="mat-elevation-z2" *ngIf="!isLoading && !errorMessage">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let pharmacist">{{ pharmacist.id }}</td>
      </ng-container>
      <ng-container matColumnDef="firstname">
        <th mat-header-cell *matHeaderCellDef>Prénom</th>
        <td mat-cell *matCellDef="let pharmacist">{{ pharmacist.firstname }}</td>
      </ng-container>
      <ng-container matColumnDef="lastname">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let pharmacist">{{ pharmacist.lastname }}</td>
      </ng-container>
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let pharmacist">{{ pharmacist.email }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let pharmacist">
          <button mat-icon-button color="primary" [routerLink]="['/admin/pharmacist', pharmacist.id]">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deletePharmacist(pharmacist.id)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
    <button mat-raised-button color="primary" class="add-button" [routerLink]="['/admin/pharmacist/create']">
      <mat-icon>add</mat-icon> Ajouter un pharmacien
    </button>
  </div>
</div>
