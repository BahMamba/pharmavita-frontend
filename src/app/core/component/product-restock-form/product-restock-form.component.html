<mat-toolbar color="primary">
  <span>Réapprovisionner le produit {{ product?.name || '' }}</span>
</mat-toolbar>
<div class="content-container">
  <mat-spinner *ngIf="isLoading" class="spinner"></mat-spinner>
  <div *ngIf="!isLoading && product" class="product-info">
    <p><strong>Nom :</strong> {{ product.name }}</p>
    <p><strong>Stock actuel :</strong> {{ product.stock }}</p>
    <p><strong>Catégorie :</strong> {{ product.category }}</p>
  </div>
  <form [formGroup]="restockForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading" class="form-container">
    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Quantité à ajouter</mat-label>
      <input matInput type="number" formControlName="stockChange" placeholder="Quantité à ajouter" title="Quantité à ajouter">
      <mat-error *ngIf="restockForm.get('stockChange')?.hasError('required')">Quantité requise</mat-error>
      <mat-error *ngIf="restockForm.get('stockChange')?.hasError('min')">Minimum 1</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Raison</mat-label>
      <mat-select formControlName="reason">
        <mat-option *ngFor="let option of reasonOptions" [value]="option.value">{{ option.label }}</mat-option>
      </mat-select>
      <mat-error *ngIf="restockForm.get('reason')?.hasError('required')">Raison requise</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="form-field">
      <mat-label>Date de réapprovisionnement</mat-label>
      <input matInput [value]="currentDate" disabled placeholder="Date de réapprovisionnement" title="Date de réapprovisionnement">
    </mat-form-field>

    <div class="button-container">
      <button mat-raised-button color="primary" type="submit" [disabled]="restockForm.invalid || isLoading">
        Valider
      </button>
      <button mat-button color="warn" (click)="cancel()" type="button">Annuler</button>
    </div>
  </form>
</div>
