<mat-toolbar color="primary">
  <span>Gestion des stocks (Admin)</span>
</mat-toolbar>
<div class="content-container">
  <div class="filter-container">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Filtrer par stock</mat-label>
      <input matInput [(ngModel)]="filter" (keyup.enter)="applyFilter()" placeholder="Ex: 5">
      <button mat-icon-button matSuffix (click)="applyFilter()">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Statut</mat-label>
      <mat-select [(ngModel)]="statusFilter" (selectionChange)="applyFilter()">
        <mat-option *ngFor="let option of statusOptions" [value]="option.value">{{ option.label }}</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" [routerLink]="['/admin/products/create']">
      <mat-icon>add</mat-icon> Ajouter un produit
    </button>
  </div>
  <mat-spinner *ngIf="isLoading" class="spinner"></mat-spinner>
  <table mat-table [dataSource]="products.content" class="mat-elevation-z2" *ngIf="!isLoading">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let product">{{ product.name }}</td>
    </ng-container>
    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Catégorie</th>
      <td mat-cell *matCellDef="let product">{{ product.category }}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef>Prix</th>
      <td mat-cell *matCellDef="let product">{{ product.price | currency:' GNF ' }}</td>
    </ng-container>
    <ng-container matColumnDef="stock">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let product">{{ product.stock }}</td>
    </ng-container>
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let product">{{ product.status }}</td>
    </ng-container>
    <ng-container matColumnDef="expirationDate">
      <th mat-header-cell *matHeaderCellDef>Date d'expiration</th>
      <td mat-cell *matCellDef="let product">{{ product.expirationDate | date:'dd/MM/yyyy' }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let product">
        <button mat-icon-button color="primary" [routerLink]="['/admin/products/restock', product.id]" matTooltip="Réapprovisionner">
          <mat-icon>inventory</mat-icon>
        </button>
        <button mat-icon-button color="accent" [routerLink]="['/admin/products/edit', product.id]" matTooltip="Modifier">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteProduct(product.id)" matTooltip="Supprimer">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button color="primary" [routerLink]="['/admin/products/restock-history', product.id]" matTooltip="Historique">
          <mat-icon>history</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
  <mat-paginator
    [length]="products.totalElements"
    [pageSize]="pageSize"
    [pageIndex]="page"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="handlePageEvent($event)"
    *ngIf="!isLoading">
  </mat-paginator>
</div>
